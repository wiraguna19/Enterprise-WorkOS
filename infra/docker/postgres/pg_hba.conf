# Client authentication for the LOCAL primary (infra/docker/docker-compose.yml).
#
# The image's default file allows replication from localhost only, so a
# replica in another container could not stream from it. Mounted rather than
# written by an init script: init scripts run only on an EMPTY volume, and
# every existing checkout already has one.
#
# TYPE  DATABASE     USER    ADDRESS   METHOD
local   all          all               trust
host    all          all     127.0.0.1/32  trust
host    all          all     ::1/128       trust
host    replication  workos  all       scram-sha-256
host    all          all     all       scram-sha-256
